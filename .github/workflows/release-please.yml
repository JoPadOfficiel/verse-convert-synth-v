name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
      release-sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Create or update the release pull request
        id: release
        uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Release Please cannot address the `verse` entry inside Cargo.lock: that
      # file is an array of [[package]] tables and its TOML updater does not
      # support the jsonpath filter that would select one. Left alone, the lock
      # keeps the previous version, check-version.mjs refuses the mismatch, and
      # build.yml runs that check before compiling — so the release would ship
      # without a single binary. Repair the branch here, while it is still a
      # pull request.
      # `pr` is unset on the run that creates the release rather than a pull
      # request, and a skipped `if` does not stop GitHub from evaluating the
      # rest of the step, so `fromJson` must never appear in one: it fails the
      # whole job on an empty string. Decode the payload in the shell instead,
      # from a plain string substitution that is safe when empty.
      - name: Resolve the release branch
        id: branch
        if: steps.release.outputs.prs_created == 'true'
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          branch="$(jq -er '.headBranchName' <<<"$RELEASE_PR")"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Check out the release branch
        if: steps.branch.outputs.name != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.branch.outputs.name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        if: steps.branch.outputs.name != ''
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Keep Cargo.lock in step with the release
        if: steps.branch.outputs.name != ''
        env:
          RELEASE_BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          node scripts/sync-cargo-lock.mjs
          node scripts/check-version.mjs
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo "Cargo.lock already matched the release version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "chore: sync Cargo.lock with the release version"
          git push origin "HEAD:${RELEASE_BRANCH}"

  build-release:
    name: Build released revision
    needs:
      - release-please
    if: needs.release-please.outputs.release-created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.release-please.outputs.tag-name }}
      commit_sha: ${{ needs.release-please.outputs.release-sha }}
      publish_release: true
    secrets: inherit
