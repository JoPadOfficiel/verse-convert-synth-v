[package]
name = "verse"
version = "0.10.0"
default-run = "verse"
description = "Convert karaoke, MIDI and score files into Synthesizer V or OpenUtau projects with real lyrics"
authors = ["JoPadOfficiel"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "verse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
roxmltree = "0.20"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
thiserror = "2"
hound = "3.5"
libc = "0.2"
base64 = "0.22"
unicode-normalization = "0.1.25"
lingua = { version = "1.8.0", default-features = false, features = ["english", "french", "spanish", "portuguese"] }
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
serde_yaml = "0.9"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
# Already a runtime dependency; declared again so integration tests can build a
# `.mxl` container instead of reading a fixture git never carries.
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
overflow-checks = true
